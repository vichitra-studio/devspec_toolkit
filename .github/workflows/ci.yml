
name: SpecDev CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # daily drift audit (UTC)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Schema & Spec Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for commit history if checking multiple commits
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
      - name: Install tooling
        run: pip install -e tools/
      - name: Validate all specs
        run: python -m specdev_tools.cli validate-all spec --repo-root .
      - name: Governance check (PR Title)
        if: github.event_name == 'pull_request'
        run: python -m specdev_tools.cli governance-check spec --message "${{ github.event.pull_request.title }}"
      - name: Fixtures lint
        run: python -m specdev_tools.cli fixtures-lint spec
      - name: Build trace matrix
        run: python -m specdev_tools.cli matrix spec --out tools/trace_matrix.json
      - name: Upload matrix
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix
          path: tools/trace_matrix.json
          if-no-files-found: error

  redteam:
    name: Red-Team Lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
      - name: Install tooling
        run: pip install -e tools/
      - name: Lint adversarial fixtures (same mechanism as fixtures)
        run: python -m specdev_tools.cli fixtures-lint spec

  deploy-staging:
    name: Deploy Staging (placeholder)
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: redteam
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to staging goes here (wire your real deploy step)."

  deploy-prod:
    name: Deploy Production (gated placeholder)
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to production goes here behind manual approval."
