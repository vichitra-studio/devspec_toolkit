name: Bug Report
description: Report a defect in the toolkit
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug. **Do not include secrets, tokens, or credentials** in this report."
  - type: input
    id: version
    attributes:
      label: Toolkit version
      description: "The `version` from tools/pyproject.toml."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands and inputs needed to reproduce.
      placeholder: |
        1. Run `specdev ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and how the toolkit is deployed (standalone vs git submodule).
    validations:
      required: false
