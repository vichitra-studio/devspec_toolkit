name: Question / Support
description: Ask a usage question about the toolkit
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands you have run, docs you have read, and what happened.
    validations:
      required: false
