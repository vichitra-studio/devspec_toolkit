version: "0.3.0"
release_date: "2026-02-26"
breaking: false
description: |
  Migration hardening, tools reorganization into subpackages, test infrastructure
  cleanup, and documentation updates. All CLI commands remain unchanged.

steps: []

changes:
  - type: internal_restructure
    description: "Reorganized tools/specdev_tools/ into core/, validation/, generation/, canonical/, migration/ subpackages"
    migration:
      action: none
      note: "Internal only — no consumer-facing changes. CLI entry points unchanged."

  - type: add_module
    path: "tools/specdev_tools/migration/planner.py"
    description: "Migration plan orchestrator: maps schema diffs to migration templates and orders steps"
    migration:
      action: none

  - type: add_module
    path: "tools/specdev_tools/migration/runner.py"
    description: "Migration plan executor with backup/rollback and dry-run support"
    migration:
      action: none

  - type: add_config
    path: "tools/pyproject.toml"
    description: "Added [tool.pytest.ini_options] section for pytest configuration"
    migration:
      action: none

  - type: fix
    description: "F-DOC1: Updated stale version in getting_started.md from 0.1.0 to 0.3.0"
    migration:
      action: none

  - type: fix
    description: "F-DOC2: Replaced standalone python test invocations with pytest in reference.md"
    migration:
      action: none

  - type: fix
    description: "F-DOC3: Clarified scope lock for consumer repos vs toolkit repo in reference.md"
    migration:
      action: none

  # Gap remediation changes
  - type: fix
    description: "Bug B1: Added missing validation/validators/__init__.py"
    migration:
      action: none

  - type: fix
    path: "tools/specdev_tools/migration/runner.py"
    description: "Bug B2: Fixed apply_auto_fixes call to pass required diff parameter"
    migration:
      action: none

  - type: fix
    path: "tools/specdev_tools/validation/validate.py"
    description: "Bug B4: _get_step_from_path now returns '16' for impl_context/ files"
    migration:
      action: none

  - type: add_module
    path: "prompts/migration/"
    description: "Bug B3/Task 0.4: 14 migration prompt templates for AI-assisted migration"
    migration:
      action: none

  - type: change_schema
    step_id: "16_impl_context"
    path: "plan.review_requirements.nfr_measurement_methods"
    description: "Task 0.1: Generalized to patternProperties instead of hardcoded NFR IDs"
    migration:
      action: auto
      note: "Existing data remains valid — patternProperties is more permissive"

  - type: change_schema
    step_id: "16_impl_context"
    path: "plan.review_requirements.timeout_constants"
    description: "Task 0.1: Generalized to patternProperties instead of hardcoded constant names"
    migration:
      action: auto

  - type: add_field
    step_id: "16_impl_context"
    path: "_migration_notes"
    description: "Task 0.1: Optional string field for migration notes"
    migration:
      action: none

  - type: add_constraint
    step_id: "16_impl_context"
    path: "plan.spec_alignment.checklist[].nfr_refs"
    description: "Task 0.2: nfr_refs and fixture_ref now required on non-deferred checklist items"
    migration:
      action: ai_assisted
      prompt: template_impl_context.md

  - type: add_field
    path: "schema/core/collections.schema.json#seedRef"
    description: "Task 1.3: Added optional hash (SHA-256) and version fields to seedRef"
    migration:
      action: none

  - type: add_definition
    path: "schema/core/collections.schema.json#specRefIngested"
    description: "Task 1.2: New specRefIngested type for tracking upstream artifact ingestion"
    migration:
      action: none

  - type: add_config
    path: "tools/step_order.json"
    description: "Task 1.1: Added step_metadata with required_spec_inputs, required_seed_inputs, extraction_intent"
    migration:
      action: none

  - type: change_config
    path: "scripts/init_project.py"
    description: "Task 3.5: Venv name now configurable via --venv-name (default: dev_env)"
    migration:
      action: none
