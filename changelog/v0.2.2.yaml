version: "0.2.2"
release_date: "2026-02-12"
breaking: false
description: |
  Enhances checklist tracking with NFR and fixture references, adds new evidence types,
  introduces timeout and measurement configuration, and strengthens validation rules.

changes:
  - type: add_field
    step_id: "16_impl_context"
    path: "checklist[].type"
    description: "Added 'security' as a valid checklist item type"
    migration:
      action: auto
      operations:
        - add_enum_value
        - enum_name: checklist_type
        - value: security

  - type: add_field
    step_id: "16_impl_context"
    path: "checklist[].layer"
    description: "Added 'integration' and 'security' as valid implementation layers"
    migration:
      action: auto
      operations:
        - add_enum_value
        - enum_name: implementation_layer
        - value: integration
        - add_enum_value
        - enum_name: implementation_layer
        - value: security

  - type: add_field
    step_id: "16_impl_context"
    path: "checklist[].nfr_refs"
    description: "Added nfr_refs field to link checklist items to Non-Functional Requirements"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "checklist[].fixture_ref"
    description: "Added fixture_ref field for test fixture tracking"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "checklist[].decision"
    description: "Added decision field to track how ambiguities are resolved"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "checklist[].resolved"
    description: "Added resolved field to track resolution status"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "execution.evidence.type"
    description: "Added 'reference' as a valid evidence type"
    migration:
      action: auto
      operations:
        - add_enum_value
        - enum_name: evidence_type
        - value: reference

  - type: add_field
    step_id: "16_impl_context"
    path: "execution.evidence.path"
    description: "Added path field to evidence for file reference"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "execution.evidence.section"
    description: "Added section field to evidence for specific documentation sections"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "plan.nfr_measurement_methods"
    description: "Added nfr_measurement_methods field to define NFR measurement approaches"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_field
    step_id: "16_impl_context"
    path: "plan.timeout_constants"
    description: "Added timeout_constants field to define timeout configurations"
    migration:
      action: auto
      operations:
        - add_field

  - type: add_constraint
    step_id: "16_impl_context"
    path: "checklist[].nfr_refs"
    description: "Non-deferred checklist items must have nfr_refs"
    migration:
      action: auto

  - type: add_constraint
    step_id: "16_impl_context"
    path: "checklist[].fixture_ref"
    description: "Non-deferred checklist items must have fixture_ref"
    migration:
      action: auto

  - type: add_constraint
    step_id: "16_impl_context"
    path: "checklist[].type"
    description: "Checklist items must use valid types"
    migration:
      action: auto

  - type: add_constraint
    step_id: "16_impl_context"
    path: "checklist[].layer"
    description: "Checklist items must use valid layers"
    migration:
      action: auto

  - type: add_constraint
    step_id: "16_impl_context"
    path: "execution.evidence.type"
    description: "Evidence must use valid types"
    migration:
      action: auto