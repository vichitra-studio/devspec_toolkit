# Changelog Format Schema
# All changelog/vX.Y.Z.yaml files must follow this structure

format_version: "1.0"

required_fields:
  - version        # Semantic version string (e.g., "0.2.0")
  - breaking       # boolean - true if any breaking changes

optional_fields:
  - description    # Multi-line summary of the release
  - steps          # List of steps included in this version
  - changes        # List of changes from previous version
  - source_of_truth  # Path to the authoritative source file for this changelog
  - render_target    # Path to the rendered Markdown derived from source_of_truth

change_types:
  - add_step        # New step added to toolkit
  - remove_step     # Step removed from toolkit
  - rename_step     # Step renumbered/renamed
  - merge_steps     # Multiple steps consolidated into one
  - split_step      # One step decomposed into multiple
  - add_field       # New field added to schema
  - remove_field    # Field removed from schema
  - rename_field    # Field renamed in schema
  - change_type     # Field type changed
  - add_constraint  # New validation constraint
  - paradigm_shift  # Format change (prose→JSON)
  - add_module      # New module/file added to tools
  - add_config      # New configuration added
  - change_config   # Configuration changed
  - change_schema   # Schema structure modified
  - add_definition  # New shared definition added
  - add_script      # New script/migration tool added
  - remove_validator # Validator or error code removed
  - fix             # Bug fix
  - internal_restructure # Internal code reorganization

migration_actions:
  - none           # No migration needed
  - auto           # Mechanical fix, applied automatically
  - ai_assisted    # Requires AI prompt generation
  - merge          # Step consolidation
  - archive        # Move to archive
