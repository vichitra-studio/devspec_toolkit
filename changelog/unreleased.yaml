version: "unreleased"
breaking: true
source_of_truth: changelog/unreleased.yaml
render_target: changelog/unreleased.md

changes:
  - type: add_definition
    description: >
      Added schema/core/graph.schema.json (vc:core:graph): the x-node / x-link
      annotation language step schemas use to declare graph nodes and links
      (roles, closed set of 19 link verbs, lifecycle, scope, scope_reason and
      the scope-reason rule). The seed manifest
      (schema/seed_manifest.schema.json, top-of-graph seed kind) and the step
      schemas 00, 01, 02, 02a, 03, 04 and 05 are annotated; the schemas of
      steps 06 to 12, 14, 15 and 16 are annotated too; the schemas of steps 13 and 13a carry no annotation.
    migration:
      action: none

  - type: add_module
    description: >
      Added the annotation reader and lint (registry/annotations.py, ANNOT-NN
      toolkit-author codes) and the step-order derivation
      (registry/step_order_gen.py, ANNOT-20 / ANNOT-21). registry-generate
      folds annotated nodes into entry_key_registry.json; a toolkit with no
      annotations produces unchanged entries, with _format_version 1.1.0.
    migration:
      action: none

  - type: add_config
    description: >
      Added tools/cli_commands.json (generated, byte-exact with the CLI parser;
      schema/cli_commands.schema.json) and the registry-generate flags
      --cli-commands-out and --step-order-out.  Toolkit-internal; no host action.
    migration:
      action: none

  - type: change_schema
    description: >
      schema/entry_key_registry.schema.json accepts annotation-derived entries
      (source, role, contract, coarse, links; map-keyed entries without
      id_field; glob keys such as impl_context/ms_*_plan.json) and the
      step "extras" for record-host entries. Host
      entry_key_registry.json files are unaffected.
    migration:
      action: none

  - type: fix
    description: >
      schema_nav.effective_schema keeps keywords that sit beside a $ref
      (description, default, items bounds) instead of dropping them. Only
      description-level and sibling keys change in merged schemas; validation
      results are unchanged.
    migration:
      action: none

  - type: fix
    description: >
      Step 13 governance_label_ref is no longer checked by E590 / W590
      against step 10; the label resolves through canon (E110 when unknown) and
      E210 stays for labels also present in step 10. Removes a clash between
      E590 and E210 on the same label. Hosts with no declared extensions
      (none-required) see no change. Description-only change in
      schema/13_extension_manifest.schema.json.
    migration:
      action: none

  - type: internal_restructure
    description: >
      spec-check and the canonical checks share one schema registry and cache
      validators (core/registry.py: get_shared_registry, get_cached_validator,
      clear_shared_caches), removing repeated schema loads. Speed only.
    migration:
      action: none

  - type: paradigm_shift
    description: >
      Breaking for host specs: steps 00 to 05 move to the spec-graph shape.
      Step 00 (charter): in_scope / out_of_scope merge into scope_items (each
      with scope in | later | out, scope_reason for later / out, scope_id), and
      the 1.1.1 floor of three entries in each of the two lists becomes one
      entry in scope_items;
      assumptions, risks and stakeholder needs become objects with ids (they
      were strings); stakeholders gain stakeholder_id; new constraints list; links removed; derives_from added to scope items,
      assumptions, risks, needs, segments, metrics and constraints. Step 01:
      capabilities lose goal_id, success_metric_refs and trace and gain
      derives_from and scope_reason; the scope value future becomes later.
      Step 02: components and connections lose trace;
      connections lose from, to, schema_ref and interface_ref and gain
      connection_id, derives_from (source) and connects_to; new third_parties
      list (tech_stack is removed); component type external and the tag
      external-dependency are removed (model the service as a third_parties
      entry). Step 02a: artifact-level trace removed;
      ci_gates and secrets become objects (gate_id, secret_id); each
      environment gains scope, derives_from and a config object that holds the
      host keys. Step 03: terms gain aliases, lifecycle and replaces. Step 04:
      FRs lose trace and gain derives_from (capabilities) and depends_on (FRs);
      acceptance criteria gain scope. Step 05: APIs lose trace and example_refs
      and gain derives_from (FRs), provided_by, relies_on and depends_on; each
      error gains required error_id, scope and derives_from. scope (in | later |
      out) becomes required on every functional requirement, API, API error,
      acceptance criterion, charter risk, environment, CI gate and secret
      (none of them had it in 1.1.1; capabilities already required it).
      scope_reason is required wherever scope is later or out, capabilities
      included (1.1.1 had no such rule).
      derives_from with at least one id becomes required on every node of
      steps 00 to 05 except stakeholders, glossary terms and acceptance
      criteria. A stakeholder needs at least one need.  Every
      node accepts aliases, lifecycle and replaces; every node except an
      assumption and a glossary term also accepts assumes. Existing host specs do
      not validate until migrated; the migration passes for steps 00 to 05 land
      later in this release, and the specdev align status / diff / plan
      commands report nothing for a 1.1.1 spec of steps 00 to 05 against the
      new schemas, top-level renames such as in_scope to scope_items included,
      because the differ reads only a schema's own top-level required,
      properties and additionalProperties, and these step schemas keep their
      properties under allOf.
    migration:
      action: ai_assisted

  - type: remove_validator
    description: >
      Link-existence checks are removed from the step validators of 01
      (capability to component; validate_step_01 now returns no errors), 02
      (connection endpoints) and 05 (API to requirement, with its W590 for a
      missing step 04 file). Nothing replaces them until the graph resolver
      later in this release, so a step 00 to 05 spec gets no link-existence or
      cycle error in the meantime. The step 04 check that a requirement
      carries a non-empty trace and the step 02 check for a missing tech_stack
      go with those fields. The step 02 capability-coverage check (E590)
      stays; it now reads component derives_from and exempts capabilities
      whose scope is later or out. The other content checks stay.
    migration:
      action: none

  - type: change_schema
    description: >
      E311 (MISSING_ENUM_PROVENANCE) is narrowed: it fires only for an API that
      declares a parameters[].enum without enum_provenance; error lists and
      error_codes no longer trigger it. schema/05_interface_contracts.schema.json
      adds the optional parameters[].enum (array of strings, minItems 1, unique).
    migration:
      action: none

  - type: change_config
    description: >
      registry-check no longer reports E622 for a registered root collection
      (plain name or first hop of a wide path) that is absent from a spec file,
      matching nested arrays (key not present); a present null, a collection
      of the wrong shape, a file whose top level is not an object and a
      missing id_field are still E622. Required presence stays with schema validation.
    migration:
      action: none

  - type: change_config
    description: >
      A check that reads fields of the 1.1.1 shape (trace, goal_id,
      success_metric_refs) runs only when the files it reads carry those
      fields. A spec whose steps 00 to 05 have the new shape gets none of
      E560, W564 / E535 and W568, and no FR-to-API coverage finding from the
      matrix (W592, or E592 when coverage_thresholds.mode is error), whatever shape its later steps have, until graph coverage later
      in this release. A 1.1.1 spec whose step-05 APIs carry no trace at all
      gets no W564 and no W592 / E592; such a file is invalid
      under the 1.1.1 schema. For a spec whose steps 00 to 05 have the new
      shape, completeness-check reports FR-to-API coverage and
      capability-to-FR coverage as complete (ratio 1.0), because the checks
      behind those two numbers do not run on it, until graph coverage later in
      this release. For the same spec, specdev matrix writes a trace matrix
      which omits fr_with_api and the apis of each FR row and names them in a top-level not_computed list, because its FR-to-API reader does not run on it; no W592 / E592
      follows from that. The W583 reader of step 11 reads API derives_from: a 1.1.1
      step-05 API linked only to parked requirements through trace is no
      longer exempt from W583.
    migration:
      action: none

  - type: remove_validator
    description: >
      W555 text no longer cites a charter minItems:3 bound (the threshold is a
      seed-quality heuristic). scripts/generate_fixtures_02a.py removed (stale,
      nothing called it); toolkit-internal.
    migration:
      action: none

  - type: paradigm_shift
    description: >
      Steps 06 to 16 move to the spec-graph shape, with the core schemas they
      share; existing host specs do not validate until migrated. No migration path
      exists yet for a 1.1.1 spec to this shape: the align migration passes land
      in a later 1.2.0 change, and specdev align status / diff / plan read only a
      schema's own top-level required, properties and additionalProperties, while
      the step schemas keep most or all of their properties under allOf, so they
      miss the changes below, top-level ones included (align diff reports a 1.1.1
      file of step 07, 08, 11 or 14 as OK).
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Core and every step schema: spec_refs_ingested and seed_refs_ingested are
      removed from steps 00 to 16 (13a, 16_anchor and 16_impl_context included)
      and from core/step_base, with the definitions specRefIngested* and seedRef*.
      Steps 00 to 15 except 13a gain an optional top-level ambiguities list of
      open items: each item has id, description and about (ids it concerns), and
      optional missing_kind, decision and proposed_assumption; it has no other
      field. plan.ambiguities in 16_anchor and 16_impl_context, and
      execution.emergent_ambiguities in 16_impl_context, use the same open item:
      severity, status, impact and resolved are removed (and source and mitigation
      from plan.ambiguities of 16_impl_context), and about is required. The core
      definitions crossCycleAmbiguityItem and ambiguityStatus are removed.
      testingMode and step 08 fixtures[].mode gain the value manual. The core
      definitions dependencyList, techStack, techStackItem, techStackList,
      dependencyItem, dependencyObjectList, link, httpMethodFull, traceRef and
      traceId are removed with their last use.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Steps 02, 04 and 05 (finishing the step 00 to 05 change above): tech_stack
      is removed from step 02 (use third_parties[]); the priority value wont-have
      is removed from step 04 functional requirements (use scope: later or scope:
      out); the top-level out_of_scope list is removed from step 05 (mark the
      requirement scope: out with a scope_reason).
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Steps 06 and 07: rules[].trace (step 06) and nfrs[].trace (step 07) are
      replaced by constrains, an optional list of ids of functional requirements,
      APIs, components or connections. Step 06 rules[].scope, an object
      {components, apis} in 1.1.1, becomes the string in | later | out (default
      in; later and out need scope_reason). Step 07 gains optional relies_on
      (third parties), derives_from (metrics) and scope / scope_reason. Both steps
      gain optional assumes, lifecycle, aliases and replaces on every node. The
      node kind of step 06 is invariant.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 08: fixtures[].targets is replaced by verifies (ids of acceptance
      criteria, APIs, invariants or NFRs; not FRs), and the top-level out_of_scope
      list is removed. A fixture needs verifies or removes. New optional
      manual_reason (a string of at least 10 characters), required when mode is
      manual. Fixtures gain lifecycle, aliases and replaces.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 09: the top-level tech_stack, tech_stack_ref, trace, dependencies and
      dependency_ref are removed, and milestones is the step's own required
      top-level field (the step-base fields id, owner, created_at and
      canonical_refs_used stay required). Each milestone loses status, deliverables and depends_on and requires
      schedules (at least one id of a functional requirement, acceptance
      criterion, API, invariant, NFR, component, environment or risk); it gains
      lifecycle, aliases and replaces. The node kind is design-milestone.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 10: pr_rules, spec_first_policy, review_policy, reviewers, trace and
      links are removed. rules (at least one) is required beside
      commit_message_rules. Each rule (node kind rule) needs rule_id, text and
      derives_from (at least one id of a constraint, risk, scope item, gate,
      environment or stakeholder), and may carry enforcer (only review),
      cli_command, assumes, scope, scope_reason, lifecycle, aliases and replaces;
      a rule with enforcer must not carry cli_command. versioning, policy_ref and
      command_ref stay.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 11: the artifact-level trace is removed. A threat's target_ids becomes
      threatens (required, at least one id of an API, component, connection or
      third party) and mitigations becomes mitigated_by (optional ids of
      functional requirements, criteria, APIs, API errors, invariants, NFRs,
      rules, gates, secrets, environments, constraints or fixtures); a threat
      gains optional derives_from (risks). An edge case now requires threatens
      (APIs, components or FRs) and mitigated_by (at least one id). Threats and
      edge cases gain scope, scope_reason, assumes, lifecycle, aliases and
      replaces. The node kinds are threat and edge-case.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 12: trace is removed. jobs[].requires is renamed jobs[].depends_on (ids
      of jobs of the same file), and jobs[].steps[].id is removed (a step needs
      name and command). Jobs gain optional realises (environments, gates, secrets
      or rules), verifies (NFRs), lifecycle, aliases and replaces. The node kind
      is job.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 14: the top-level tech_stack, tech_stack_ref, dependencies,
      dependency_ref and trace are removed. A milestone loses status,
      milestone_status_reason, source_milestones, fr_refs, capability_refs and
      deliverables, and requires milestone_id, name, target_date, user_story and
      tasks (node kind roadmap-milestone). A task loses status, status_reason,
      assumptions, exit_conditions, fr_refs and invariant_refs; its depends_on
      items are kebab-case task ids; it gains disposition (value: deferred or
      wont_do, and reason, both required) to set a task aside (node kind task). An
      acceptance criterion's fixture_ref is renamed verified_by (ids of fixtures,
      jobs or rules), and the criterion needs refines (at least one id of an
      upstream node) or removes (at least one id) (node kind task-criterion).
      Milestones, tasks and criteria gain lifecycle, aliases and replaces.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 15: trace and links are removed. Each interface_map[] row loses
      interface_ref and method and requires row_id (a kebab-case id, unique in the
      file), realises (at least one API id) and path; an API may be realised by
      several rows. Rows gain lifecycle, aliases and replaces. The node kind is
      scaffold-row. project_skeleton, validators, command_ref and build_status
      stay.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 16 anchor (16_anchor): each plan.milestone_index[] row loses
      milestone_id, context_path and fr_refs. A row requires anchor_id, about (the
      id of one roadmap milestone), checklist_id_prefix and summary; status stays
      and is optional, and an absent status reads as pending. deferral_reason is
      required when status is deferred; close (signed_off_by, and source when
      signed_off_by is legacy-migration) is required when status is done. The node
      kind is anchor-row.
    migration:
      action: ai_assisted

  - type: change_schema
    description: >
      Step 16 plan (16_impl_context): the file requires a file-level milestone
      (the roadmap milestone id the plan is about), and the anchor validator finds
      the plan of an anchor row through it (milestone-state still finds a plan by
      its file name). plan.status, plan.deferred_reason and plan.coverage_status are removed.
      A plan item (plan.spec_alignment.checklist[], node kind plan-item) loses
      spec_ref, milestone_ref, nfr_refs, fixture_ref, checklist_status,
      deferred_reason, wont_do_reason, linked_test_expectation and
      implementation.status; it requires id, realises (at least one task-criterion
      id), description and implementation, and gains lifecycle, aliases and
      replaces. Also removed:
      plan.spec_alignment.requirements_summary[].spec_refs,
      plan.security.new_fixtures, plan.security.spec_mutations,
      execution.critical_evidence, execution.execution_results[].evidence_binding,
      review.fixture_status.test_results and extensions.review_state; review.findings[].spec_ref loses line_range and commit_hash;
      review.fixture_status.implemented_interfaces[] items are plain kebab-case
      ids. A passed execution.execution_results[] entry no longer needs evidence_binding
      beside evidence_ref.
    migration:
      action: ai_assisted

  - type: remove_validator
    description: >
      Error codes removed from the registry, PROMOTABLE_PAIRS (25 pairs become 23:
      W581 to E581 and W582 to E582 go) and the catalog
      docs/developers/error-codes.md: E142, E581, E582, W574, W581, W582, W602,
      W605, W607, W612 and W616. The fields they read are gone, and no emitter is
      left. The E530 sub-code LINKED_TEST_FILE_NOT_FOUND is removed with its guide
      (specdev guide E530-LINKED_TEST_FILE_NOT_FOUND no longer exists) and its
      JSON remediation advice. hallucination-lint no longer checks
      linked_test_expectation paths and no longer reports INVENTED_ENUM_OR_ID for
      pr_rules. E305, E307 and E596 stay.
    migration:
      action: none

  - type: change_schema
    description: >
      Step validators, in the 1.2.0 shape: step 06, 07 and 08 no longer report
      E520 for a missing trace or targets, E530 for a trace-target pattern, or
      E590 / W590 for a link target; fixtures-lint no longer reports E520 (missing
      targets) or E590 (targets unknown API / FR / Invariant / NFR), a 1.1.1
      fixture file with targets included; its input / expected checks stay. Step
      09 no longer checks that a deliverable names a capability (E590 / W590).
      Step 10 no longer reports E530 for pr_rules or for a trace type or link
      target. Step 11 no longer reports E520, E530 or E590 for the ids a threat
      names: W583 is satisfied by a threat threatens and W615 by a threat
      mitigated_by, and both still skip an API or invariant whose every linked FR
      is parked. Step 12: E141 reads depends_on, and E590 now means a depends_on
      entry names no job. Step 14 no longer reports E590 for source_milestones,
      fr_refs or capability_refs, or E520 / E530 for dependency entries; the cycle
      check (E141), duplicate ids and date checks stay. Step 15: a duplicate
      row_id is reported as E520; the E520 check for a duplicate interface_ref and
      the E530 check for method are gone. The deep validators of steps 01 to 16 do
      not raise on a value of the wrong type, in the file they validate or in a
      file they read; the schema reports it for the file that holds it (a
      validator may also report its own finding). traceability-check,
      completeness-check and matrix read a spec file that is not UTF-8 JSON with
      an object at the top level as an unreadable file, instead of ending with
      specdev: fatal error. The
      step 16 anchor no longer emits W607 or W612; a plan file with no milestone
      key is skipped with W608, a plan whose milestone no anchor row is about is
      skipped with W611, and W610 pairs a plan with its row through milestone.
      E302 no longer checks execution.critical_evidence.passed_test_commands. E304
      now means: the plan's milestone is not a roadmap milestone, or a task of it
      (not set aside by disposition) has no plan item whose realises names one of
      its criteria; a task with no acceptance criterion is reported as well, since
      no plan item can realise it. A plan with no plan.status is read as active by the E301
      plan-level check.
    migration:
      action: none

  - type: change_config
    description: >
      No step validator checks that a link target exists in steps 06 to 16 in this
      release; the link resolver of a later 1.2.0 change does. The checks that
      read 1.1.1 plan fields run only on plan items that carry them: E301 (item
      shapes), E305, W599, W600 and W601 key on implementation.status, and E307 on
      an object spec_ref. On a 1.2.0 plan item they report nothing.
    migration:
      action: none

  - type: change_config
    description: >
      tools/step_order.json is generated by specdev registry-generate; do not edit
      it by hand. It is derived from the x-link declarations of the step schemas,
      plus the hand-carried keys version, steps, policy, coverage_thresholds and
      the new declared_edges ([producer, consumer] pairs for context reads no
      stored link carries; steps 13, 13a, 16a, 16b and 16c keep their 1.1.1 reads
      there, step 14 keeps its reads of steps 13 and 13a, and [09, 14] and
      [14, 16] stand for computed links). Against 1.1.1, 15 pairs are added (written consumer<-producer: 02<-00,
      02a<-00, 05<-00, 06<-00, 07<-05, 09<-06, 11<-00, 11<-02a, 11<-10, 12<-07,
      14<-02a, 14<-05, 14<-06, 14<-07, 14<-10) and 28 are removed (03<-00, 03<-01,
      03<-02, 04<-03, 05<-03, 07<-02a, 07<-03, 08<-02, 08<-02a, 09<-01, 09<-08,
      10<-02, 10<-09, 11<-01, 14<-02, 15<-02, 15<-02a, 15<-04, 15<-08, 15<-11,
      15<-14, 16<-04, 16<-05, 16<-08, 16<-09, 16<-11, 16<-12, 16<-15). A removed
      pair is a context read no link carries: forward replay staleness (W595),
      prompt-context and context list fewer consumers and inputs for those steps.
      The glossary (step 03) has no inputs and no consumers in the derived order,
      and dag-lint exempts it from E596 beside 16c.
    migration:
      action: none

  - type: change_config
    description: >
      specdev registry-generate writes tools/step_order.json and the new
      docs/developers/schema-change-checklist.md (rendered from
      tools/schema_changes.json) when --out is absent; --step-order-out now
      defaults to the first file, and the new --checklist-out sets the second. A
      failed annotation lint, a missing annotated step or a malformed rows file
      ends the command with registry-generate: failed:. The generator-owned files
      are now entry_key_registry.json, extraction_paths.json, step_order.json,
      cli_commands.json and the checklist. In entry_key_registry.json, the kind
      inv becomes invariant, milestone becomes design-milestone (step 09) and
      roadmap-milestone (step 14), and the step 14 dependency entry is removed;
      the step 11 mitigation entry is removed too; the kinds rule, task-criterion,
      scaffold-row, anchor-row, plan-item and ambiguity-item are new. Step 16a is registered under the key impl_context/ms_*_plan.json,
      which holds the plan items and the two ambiguity lists of a plan file
      (plan.ambiguities, execution.emergent_ambiguities), so registry-check reads
      those lists in plan files; 16b and 16c stay deferred.
    migration:
      action: none

  - type: change_config
    description: >
      specdev completeness-check reports a coverage dimension whose reader finds
      none of its 1.1.1 fields on a 1.2.0-shaped spec as vacuous (covered_count 0,
      total_count 0, ratio 1.0, uncovered_ids empty); --json lists the dimension
      names (fr_api_coverage, fr_fixture_coverage, fr_milestone_coverage,
      capability_fr_coverage) in not_computed, and the text output prints [SKIP]
      <label>: not computed on this spec shape. specdev matrix omits a value whose
      reader is skipped and names it in a top-level not_computed list:
      fr_with_api, apis, fr_with_fixture, fixtures, fr_with_nfr, nfrs,
      fr_with_threat, threats, milestone_coverage and invariant_threat_coverage.
    migration:
      action: none

  - type: change_config
    description: >
      For now these report nothing on a 1.2.0-shaped file, because they read
      removed fields: the closure codes E535, E536, E560, W561, W562, W563, W564,
      W565, W566, W568, W569, W575 and W576 (W567 still reports a milestone with
      no tasks; a new-shape anchor has no context_path, so the closure checks load
      no milestone plans from it); the matrix links (fixture targets, NFR trace,
      threat target_ids and mitigations, step 14 fr_refs) and its
      milestone_coverage and invariant_threat_coverage; the step 14 W604
      matrix-staleness check; the scope resolver's edges for trace, targets,
      fr_refs and source_milestones; the reviewer's structural pass, which is
      skipped for an artifact without a trace array, so it gives no FAIL on
      structure; and the step 16 checks of 1.1.1 plan items and E308 / E309 arms
      named above. specdev upstream-backlog and milestone-state read both
      ambiguity shapes: an open item (about, no severity) is listed with severity
      null and status open in the unclassified bucket, never fires W613, is never
      hidden by --severity (it passes --severity critical), and never blocks a
      group in milestone-state. --status resolved hides it, as it hides any open
      record, and reports W617. forward-replay-check no longer reports E555 for an id that lived only in a field removed from the schema when its row in tools/schema_changes.json has shim: true.
    migration:
      action: none

  - type: change_schema
    description: >
      Interim states until later 1.2.0 changes: the rule text of the step prompts
      still names removed fields (their Output Contract examples validate, and
      prompt-sync E310 checks every prompt); specdev align prompts output and the
      migration templates in prompts/migration/ for steps 06 to 16 still describe
      the 1.1.1 shape; the agent and skill files under .claude/,
      docs/agents/agents.md, the coverage-matrix and gap-hunter docs,
      canon/README.md, docs/developers/workflows/workflow_migration.md (links,
      trace_refs) and docs/developers/design/migration_system_spec.md still name
      removed fields or codes;
      docs/developers/workflows/workflow_feature_extension.md,
      docs/developers/workflows/spec_to_impl.md and
      docs/architecture/governance_architecture.md still describe specdev matrix
      as rebuilding the trace links of a spec;
      schema/13a_completeness_assessment still describes fr_refs, and the step 13
      title still mentions the trace matrix; tests/fixtures/spec_corpus stays
      1.1.1-shaped.
    migration:
      action: none
