  - type: add_module
    description: >
      specdev spec-check gates one step: --step N (repeat it for several steps;
      a step given twice is gated once) blocks on the errors that step N owns
      and on errors of earlier steps that are new since the baseline; --paths
      FILE... (every word up to the next option; zero or more files; write
      spec_dir before it) gates the steps of the files you list; --base-ref REF
      (default: SPECDEV_REPLAY_BASE_REF, origin/HEAD, origin/main,
      origin/master, main, master) names the base ref, and the baseline is its
      merge-base with HEAD; --detail {summary,all} lists upstream debt, pending
      (owned by a later step) and gate-owned findings in full. The report goes
      to stdout and notes to stderr, and the exit code is 1 only when the result
      is BLOCKED, with --json too. A new error is told from an old one by the
      key (code, owner, node id, link target, file, location, subcode, path; the
      location is the jq path with the array indexes removed, except an index
      inside a quoted key, which is part of the key), never by its message, and
      by count: for each key, a finding is new only when the working tree has
      more findings with it than the baseline had. A reworded message, or an
      item inserted before an old error, is not new. One limit: an error fixed
      and another of the same key (the same code, file and place, array indexes
      aside) added on the same branch reads as no change at the step gate; plain
      spec-check lists the new one, and the merge check (specdev spec-check
      --merge) reports every error. An error fixed in one file or place does not
      offset a new error in another. A schema error (E520) of spec-check --json
      now carries file (relative to the spec folder) and jq_path, and validate
      and validate-all --json give jq_path on E520 (a key that is not a name in
      jq is written in brackets: .step_requirements["00"]); the where column of
      the step gate text shows that file name where it showed -. With several
      steps each bucket of the --json report is the union over the steps. When
      no baseline can be used the report says base: unavailable, every upstream
      error counts as new, and stderr gives the reason; a branch that adds the
      spec folder, such as a host's first adoption branch (or a base commit that
      holds a file named like the spec folder), gets the spec folder is not in
      the base commit <12-char sha>: every error of an earlier step counts as
      new. With --step or --paths, a spec folder that does not exist, a toolkit
      with no readable tools/error_ownership.json, and a toolkit whose
      tools/step_order.json is unreadable (E520 <path> step order is unreadable:
      <reason>, for a missing file No such file or directory) give one E520 and
      exit 1, an unknown step with --step gives one E706 and exit 1, and a spec
      folder that is not inside --git-root with --paths gives one E708 and exit
      1 (with --step the report says base: unavailable and stderr gives the note
      the spec folder <dir> is not inside the git root <root>, so it cannot be
      found in the repository); plain spec-check on a missing spec folder prints
      every check with that E520 among the findings and exits 1. A spec file
      that cannot be read (no permission, or a folder named like a step file)
      gives one E520 from the open-items check, and the run goes on; with --step
      or --paths stderr also has the note specdev spec-check: could not read
      <file>; the answer may be incomplete (plain spec-check has the E520 only).
      --step with --paths, an empty --base-ref, and --base-ref or --detail
      without a gate are usage errors (exit 2). A path listed on --paths that
      lies outside the host root maps to no step, and the note for it gives the
      advice to pass --git-root only when --git-root was not given. A relative
      path after --paths is taken from the repository top: --git-root, else the
      top of the git working tree that holds the spec folder, else the folder
      that holds the spec folder. A step that a listed path maps to but that has
      no artifact in the spec folder is not gated, unlike with --step; when no
      step is left, stderr says no step gated: no listed path maps to a step
      that has an artifact. See docs/developers/reference.md, section "Step
      gate".
    migration:
      action: none

