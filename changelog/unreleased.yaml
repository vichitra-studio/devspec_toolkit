      no job, and E141
      (a cycle of job or task dependencies, steps 12 and 14), which is retired in favour
      of E703. A single-file specdev validate therefore no longer reports a job or
      task cycle or an unknown job in depends_on; spec-check does (E703, E700). A
      task depends_on cycle that runs through the tasks of two milestones is
      reported too (E703); 1.1.1 checked a cycle only among the tasks of one
      milestone. An id defined in two files is new in spec-check (E704): the 1.1.1
      commands did not report it (for example a task criterion id in
      14_roadmap.json equal to the id of an FR criterion in 04_fr_list.json: a
      single-file validate of each file is OK).
      validate still reports an id defined twice inside the one file (E704).
      Until the step prompts are rewritten, the prompts for steps 12 and 03 do not
      say that a job_id or a term_id must differ from the ids of nodes of other
      kinds; for example a step 12 job_id equal to the 02a gate_id it implements,
      or a glossary term_id equal to a charter metric_id, is now reported by
      spec-check as E704 (1.1.1 reported nothing);
      give the job its own id and link it to the gate with realises. The E704
      message names both places.
    migration:
      action: none

  - type: change_config
    description: >
      specdev context scope is now an alias of specdev trace: it prints the same
      keys as before (entry, resolved_ids, source_files) for the nodes a trace of
      the entry reaches in both directions, with resolved_ids grouped by node kind,
      and one deprecation line on stderr. It no longer writes
      spec/extras/trace_matrix.json, which the 1.1.1 command wrote.
      Procedures that still read that file include Step 2 of
      prompts/prompt_16b_impl_coder.md ("Query trace_matrix.json", in two places;
