      Running specdev matrix <spec_dir> --repo-root <toolkit> does not make these
      two work on a 1.2.0-shaped
      spec: the file it writes then holds one row per FR with its fr_id only (no
      apis, fixtures, nfrs or threats, which not_computed names), and a record read
      for its .trace returns null, so the procedures find no linked entity and
      report none. Until they are rewritten, use specdev trace and specdev node to
      find the entities linked to a node.
    migration:
      action: none

  - type: change_config
    description: >
      hallucination-lint, spec-quality-lint and spec-check take the ids a spec
      defines from the spec graph for every file that has graph nodes: a *_id field
      of a collection that is not a node no longer counts as a definition, so a *_ref
      that names only such an id is now reported (E530 by hallucination-lint, E520
      by spec-quality-lint; on a copy of the worked example, a note_ref naming an
      id that appears only in a coverage_notes[].fr_id was not reported by the
      1.1.1 commands). Files
      with no graph node (13a, 16b, 16c, unregistered names) keep the scan. specdev
      json resolve-pointers reports an id defined more than once in the file with
      "ambiguous": true and each definition under "locations" (it returned the first
      definition alone in 1.1.1).
    migration:
      action: none

  - type: add_module
    description: >
      The trace lock spec/extras/trace.lock.json ($schema vc:extras:trace-lock,
      schema/extras/trace_lock.schema.json) holds one entry for each link of the
      spec: the holder, the field, the target, and the content hash and chain stamp
      (sha256: and 64 hex digits) the target had when the holder accepted the link.
      A link whose target now has another chain stamp is a suspect link (E763); the
      cause is content_changed (the target was edited) or upstream_changed (a node
      above it was). Links held by the nodes of a closed milestone (an anchor row
      with status done) are not suspect and cannot be re-attested (E765). The worked
      example carries a lock of 64 entries. A host that has no lock file gets E761
      (a link with no entry) once per link from spec-check and validate-all; specdev
      attest <node-id> --yes creates the entries of a node. spec-check runs three
      new checks: trace-lock (E760 for a lock that cannot be read, E762 for an entry
      whose link is gone, E763, E882 for a baseline marker that no attest has
      cleared), computed-fields (E768 for a stored computed field such as
      content_hash) and records (E774 for an invalid record file); the graph check
      also reports E761, W720 (a new link to a deprecated node), E771 (an alias that
      collides), E772 (a replaces link to a node still in the spec) and E778 (a live
      node that links by an old id). validate-all reports E760 to E763, E778, E882
      and W720 too. The error-code catalogue has an entry for each, with a message
      copied from a run. Until a later 1.2.0 change, the skills and agents under
      .claude/ write links with the path form of specdev json (json patch <file>
      <path> <value>), which writes no lock entry, so a spec with links reports E761
      after such a write.
    migration:
      action: none

  - type: add_module
    description: >
      specdev stale [--step NN] [--diff] lists the suspect links by owning step in
      waterfall order, nodes upward first, with the cause and the nodes the change
      started from (roots); --diff adds the diff of each root's contract text against
      the text the holders accepted, recovered from git (one diff for each accepted
      version when the holders below one root accepted different ones). It exits 0 when it lists links, and an unknown step is E706; a spec file that cannot be read is a warning on stderr and a lock that cannot be read is E760, exit 1. specdev attest <node-id>
      [--field F] [--target T], attest --step NN and attest --prune write the current
      hashes into the lock for the suspect links of a node, of a step (upward first)
      or remove the entries of links that no longer exist; without --yes the first two
      print what they would write and write nothing, --dry-run never writes, with or without --yes, and --prune writes at once; --target
      takes an id or an alias. Refused with exit 1: E520 (--yes or --prune, each
      with or without --dry-run, while a spec file cannot be read, so the links it holds are not in the graph, and --yes also while a seed document is not found under the host root (--git-root, or the folder that holds --spec-root), because the hash of a link to it would be that of a missing file; nothing is written; a preview, with no --yes, still prints, with a warning on stderr that the answer may be incomplete, or a note on stderr that a seed document is not found), E764 (a node the holder links to is itself suspect: attest
      that one first), E765 (a node of a closed milestone), E706 (an unknown id or
      step), E704 (an id defined twice). specdev coverage [--by fr] prints how many
      FRs have an API or a fixture and how many capabilities have an FR, the criteria
      that have a current refinement and the exempt nodes (not_applicable, scope later
      or out); it prints information and exits 0 when it shows the counts and gaps, because no rule requires those links; a spec file that cannot be read is a warning on stderr and a lock that cannot be read is E760, exit 1. The coverage gaps are the findings E740, E742 and E743 of the role checks of spec-check: stale counts them under the step that owns each, coverage lists them under Role findings, and step ready counts them as blockers.
    migration:
      action: none

  - type: add_module
    description: >
      specdev lock merge BASE OURS THEIRS PATH is a git merge driver for the lock:
      it merges the three versions entry by entry and writes the result over OURS
      (E760 for an input that is not a valid lock, E520 for a file that cannot be read);
      when both sides changed one entry in different ways it keeps the entry the
      common ancestor had, or, when it had none, the entry with the smaller chain
      stamp (string order), and the link is suspect again when its target changed
      after the kept entry. specdev lock install-driver --driver-command CMD adds the line <path of the lock relative to the git top level> merge=specdev-trace-lock (sub/spec/extras/trace.lock.json merge=specdev-trace-lock for a spec folder sub/spec) to the file git rev-parse --git-path info/attributes names and sets
      merge.specdev-trace-lock.driver to CMD %O %A %B %P in the clone at the git root (--git-root, or the folder that holds
      --spec-root); running it again changes nothing. Until a later 1.2.0 change no setup script
      installs the driver into a host: run lock install-driver once in each clone,
      otherwise git merges the lock as text, and a conflict leaves conflict markers
      in it, which specdev reports as E760 with the repair.
    migration:
      action: none

  - type: add_module
    description: >
      specdev json patch|insert|delete --id <node-id> and specdev json insert --step
      NN write by node id: the field path is relative to the node, ids the new item
      leaves out are minted, the lock entries of the links the edit adds are written
      and those of the links it removes are dropped, and the command lists the links the edit leaves suspect (newly suspect: ...; would
      become suspect: ... with --dry-run) and, for a delete, the links that
      now point at a node that is gone (now broken). With --dry-run the report says
      lock entry to write and lock entry to remove, and nothing is written. Refused
      with exit 1: E767 (a seed, the node's own id, an edit that adds a schema violation or leaves a
      link that does not resolve or an alias collision, an insert --id into a field the node does not have and its schema does not declare as an array, or into a field that holds a string, an object, a number or a boolean, a path
      that is not a node collection of the step, the path of a collection that is a
      map keyed by id), E768 (the payload stores a computed field), E706 (an unknown
      id or step), E769 (another specdev write is running; the write lock is on the spec folder), E520 (a spec file cannot be read, so the links it holds are not in the graph, or a seed document is not found under the host root, so the hash of a link to it would be that of a missing file; also for a dry run). json insert --id creates the first item of an array field that
      the node lacks and its schema declares. These forms take --repo-root, --spec-root, --git-root and --json (CLAUDE.md says the
      json subcommands take --repo-root only: that holds for the path forms); json
      delete, json keys and json structure now accept --repo-root too.
    migration:
      action: none

  - type: add_module
    description: >
      specdev step create NN --from DRAFT [--dry-run] writes the file of step NN from
      a draft that holds the whole artifact (ids of sub-items may be left out), checks
      it against the step's schema, requires every link to resolve and writes the lock
      entries of its links; E767 when the step already has its file, for steps 13a and 16 to 16c, for a draft that cannot be read, for a draft whose $schema is not the step's
      and for a link that does not resolve; E520 when a spec file cannot be read or a seed document is not found under the host root (also for a dry run). specdev step ready NN prints step NN: ready and exits 0 when the steps NN links
      to have a spec file and no pending replay, and otherwise reports E773 with the blockers and exits 1, naming the step to write
      first (a step with no file) or to replay first; E520, exit 1, when a spec file
      cannot be read; the file of NN itself is not required. Until a later 1.2.0
      change retires step 13a, tools/step_order.json still lists it as an input of 14
      and 16a, so step ready 14 reports E773 on a spec with no 13a file.
    migration:
      action: none

  - type: add_module
    description: >
      specdev node rename OLD NEW [--dry-run] changes a node's id in one change: the
      old id goes into the node's aliases, the links that live nodes write to it are
      rewritten, and the lock entries of those links and of the node's own links are
      re-keyed with their hashes unchanged, so a rename makes no link suspect (link
      ids are hashed under the target's first name, the first entry of its aliases).
      Links held by closed milestones and by records keep the old id and resolve
      through the alias. specdev node rename --label TERM_ID "NEW LABEL" changes a
      glossary term's label and rewrites every use of the old label in the text of
      nodes of steps 04 to 15, except in nodes of a closed milestone, which it lists
      as not rewritten; the nodes whose text changes, and the nodes that link to them,
      become suspect. specdev diff prints <new id>: renamed from <old id> for a rename
      and suggests the bump patch. Before it writes, it checks the schema of the files
      it edits and the findings of the graph; it does not run the step validators, so
      a new id that breaks the id convention of a step is written and spec-check
      reports it (E530). A plan item can be renamed. Refused: E770 (a seed, a record,
      an environment, an id that a node or an alias has, the same id, a rename that
      adds a schema violation or a finding, a label of something that is not a
      glossary term), E706 (an unknown id), E520 (a spec file cannot be read, so the
      links it holds are not in the graph; also for a dry run).
    migration:
      action: none

  - type: add_module
    description: >
      Verification and evidence records: the kinds verification-record and
      evidence-record, the schemas vc:extras:verification-record and
      vc:extras:evidence-record, and the files
      spec/extras/verification/ver-<id>.json and evd-<id>.json, each {"$schema":
      ..., "records": [one record]} with the record id as the file name. The worked
      example has ver-password-reset-expired-token.json. spec-check reports E774 for
      an invalid record file (check records); a verifies or about id that no node
      has is E700 from the graph check. validate-all does not read record files.
    migration:
      action: none

  - type: add_config
    description: >
      New error codes E760 to E765, E767 to E774, E778 and E882 (E766 does not
      exist), in the catalogue docs/developers/error-codes.md and registered in
      tools/specdev_tools/core/errors.py. tools/cli_commands.json lists the new
      commands (46 top-level commands).
    migration:
      action: none

  - type: change_config
    description: >
      File-level forward replay is retired; the trace lock replaces it. validate-all
      no longer reports a changed step whose later steps did not change, and E550 is
      no longer reported for one; it stays for a diff against the base ref that cannot
      be computed. W595 is no longer reported by forward replay (specdev context
      freshness and the seed indexer still report it). specdev forward-replay-check stays as a deprecated alias with one line on
      stderr: it takes --step NN (it limits the trace-lock findings to the links held
      by nodes of that step), runs the id-regression check (E555, W598, W550;
      --base-ref and --diff-error-mode apply to it) and reports the trace-lock
      findings of spec-check. spec-check --include-forward-replay only switches the id-regression check (E555) on. Without --git-root, validate-all and forward-replay-check read the seed documents from the folder that holds the spec folder; the git history for E555, W598 and W550 is read by forward-replay-check from --git-root or, when it is absent, from --repo-root, and by validate-all from the repository of --repo-root (with the toolkit as --repo-root it reported none of them, --git-root . included). The environment variable
      SPECDEV_STALENESS_THRESHOLD and the staleness_threshold setting are removed and
      a host that sets the variable gets no effect. policy.status_write_exemptions in
      step_order.json is read by nothing; the key stays until a later 1.2.0 change. In
      validate-all, require_full_forward_replay_on_change now gates only the
      id-regression check. Until a later 1.2.0 change, validate-all has no file-level
      replay gate: a host's CI sees suspect links (E763) and links with no entry
      (E761) only. The skills and agents under .claude/ still call
      forward-replay-check and still say that W595 fires after a change; both stay
      valid until a later 1.2.0 change rewrites them, but a suspect link (E763) can
      only be cleared with attest or an edit.
    migration:
      action: none

  - type: fix
    description: >
      specdev node status and the id writes were refused for a spec file that
      already had a schema violation elsewhere (DEVSPEC-317): the differential check
      compared the message text of the violations. It now compares the path and the
      validator keyword of each violation: on the worked example with step 04 cut to
      one FR (a minItems violation), specdev node status fr-password-reset
      deprecated is written, and an edit that adds a violation is still refused.
    migration:
      action: none

  - type: fix
    description: >
      specdev diff reported no change when only a seed file outside the spec folder
      had changed (DEVSPEC-318): seed paths in the seed manifest are relative to the
      repository root, and diff read them relative to the spec folder. It now reads
      them from the repository root: on the worked example, one appended line gives
      seed-accounts: changed and the suggested bump patch, and a whitespace-only
      edit gives no change. A spec whose manifest wrote seed paths relative to the
      spec folder now shows its seeds as missing.
    migration:
      action: none

  - type: add_module
    description: >
      specdev spec-check gates one step: --step N (repeat it for several steps;
      a step given twice is gated once) blocks on the errors that step N owns
      and on errors of earlier steps that are new since the baseline; --paths
      FILE... (every word up to the next option; zero or more files; write
      spec_dir before it) gates the steps of the files you list; --base-ref REF
      (default: SPECDEV_REPLAY_BASE_REF, origin/HEAD, origin/main,
      origin/master, main, master) names the base ref, and the baseline is its
      merge-base with HEAD; --detail {summary,all} lists upstream debt, pending
      and gate-owned findings in full. The report goes to stdout and notes to
      stderr, and the exit code is 1 only when the result is BLOCKED, with
      --json too. A new error is told from an old one by the key (code, owner,
      node id, link target, file, location, subcode, path; the location is the
      jq path with the array indexes removed, except an index inside a quoted key,
      which is part of the key), never by its message, and by
      count: for each key, a finding is new only when the working tree has more
      findings with it than the baseline had. A reworded message, or an item
      inserted before an old error, is not new. One limit: an error fixed and
      another of the same key (the same code, file and place, array indexes
      aside) added on the same branch reads as no change at the step gate; plain
      spec-check lists the new one, and the merge check, which no command runs
      yet, reports every error. An error fixed in one file or place does not
      offset a new error in another. A schema error (E520) of spec-check --json
      now carries file (relative to the spec folder) and jq_path, and validate
      and validate-all --json give jq_path on E520 (a key that is not a name in
      jq is written in brackets: .step_requirements["00"]); the where column of
      the step gate text shows that file name where it showed -. With several
      steps each bucket of the --json report is the union over the steps. When
      no baseline can be used the report says base: unavailable, every upstream
      error counts as new, and stderr gives the reason; a branch that adds the
      spec folder, such as a host's first adoption branch (or a base commit that
      holds a file named like the spec folder), gets the spec folder
      is not in the base commit <12-char sha>: every error of an earlier step
      counts as new. With --step or --paths, a spec folder that does not exist,
      a toolkit with no readable tools/error_ownership.json, and a toolkit whose
      tools/step_order.json is unreadable (E520 <path> step order is unreadable:
      <reason>, for a missing file No such file or directory) give one E520 and exit 1, an unknown step with --step gives one
      E706 and exit 1, and a spec folder that is not inside --git-root with
      --paths gives one E708 and exit 1 (with --step the report says base:
      unavailable and stderr gives the note the spec folder <dir> is not inside
      the git root <root>, so it cannot be found in the repository); plain spec-check on a missing spec folder prints every check
      with that E520 among the findings and exits 1. A spec file that cannot be
      read (no permission, or a folder named like a step file) gives one E520
      from the open-items check, and the run goes on; with --step or --paths
      stderr also has the note specdev spec-check: could not read <file>; the
      answer may be incomplete (plain spec-check has the E520 only). --step with
      --paths, an empty --base-ref, --include-forward-replay with either, and
      --base-ref or --detail without a gate are usage errors (exit 2). A path
      listed on --paths that lies outside the host root maps to no step, and the
      note for it gives the advice to pass --git-root only when --git-root was
      not given. A relative path after --paths is taken from the repository top:
      --git-root, else the top of the git working tree that holds the spec
      folder, else the folder that holds the spec folder. See
      docs/developers/reference.md, section "Step gate".
    migration:
      action: none

  - type: add_config
    description: >
      New error codes W630 (OPEN_ITEM), E631 (OPEN_ITEM_AT_MERGE), E632
      (OPEN_ITEM_IN_PLAN) and W633 (OPEN_ITEM_LEGACY_TRIAGE), in the catalogue
      docs/developers/error-codes.md and registered in
      tools/specdev_tools/core/errors.py. spec-check has a new check, open-items, which reports W630: one warning for each open item of the
      1.2.0 shape and one summary for each artifact, step and array for items of
      the 1.1.1 shape; the summary names its array (3 legacy open items in
      <file> (ambiguities); see upstream-backlog, or (plan.ambiguities),
      (execution.emergent_ambiguities)). W630 and W633 are not promotable. No
      command reports E631, E632 or W633 yet: the merge gate and the close gate
      that raise them are not run by any command.
    migration:
      action: none

  - type: add_module
    description: >
      specdev spec-check runs eight new checks over the whole spec, each
      before open-items: no-dangling (E740: a node of a requirement, delivery
      or context kind that no node uses), term-use (E741: a glossary term
      whose label no node of steps 04 to 15 mentions), verifier-rules (E742: a
      fixture that no task criterion lists in verified_by, or a job that none
      lists and that realises and verifies nothing; E743: a
      criterion, API, invariant or NFR that no fixture verifies, where a job
      also counts for an NFR), cross-cutting (E744: a task that an invariant
      or NFR applies to, when no criterion of the task refines it), refinement
      (E745: a task criterion whose verifiers do not verify what it refines),
      scaffold-paths (E746: the file of a scaffold row of a built API is not
      tracked by git; the check is skipped outside a git repository),
      seed-routes (E747: a seed no route names; E748: a route no node of its
      step uses; E749: a node links a seed that the manifest does not route to
      its step) and prose-ids (E752: a node id written in the text of a node).
      The new codes are E740 to E749 and E752 (E750 and E751 do not exist); each has an entry in docs/developers/error-codes.md
      and an owner in tools/error_ownership.json: step 14 for E741, E742, E744
      and E745, step 08 for E743, step 15 for E746, step 00 for E747, the step
      of the route for E748, the step of the node for E749 and E752, and for
      E740 the latest step whose nodes can use the kind. None is promotable.
      The checks run on every spec: none is skipped because the files look
      like 1.1.1, so a spec that has not been migrated gets them too (E752
      reports its old link fields trace and targets). A child keeps its own
      scope: an FR set to scope: later does not park its criteria. E740 tells
      the author to set scope to later or out, with a scope_reason, only for a
      kind whose schema has a scope field. E745 reads a threat or an edge case
      through its mitigations. E752 reads nodes parked with scope: later or
      out, and the description of a task. E747 is the only finding for a seed
      that no route names; E749 is one finding for each link. scaffold-paths
      is skipped when every row to check lies under a submodule that is not
      checked out.
    migration:
      action: none

  - type: change_config
    description: >
      Every finding in spec-check --json has an owner: the one the finding carries,
      else the row of tools/error_ownership.json for its code, else the default owner
      of its check (merge-check for most checks). A finding that had no owner now
      shows its row's owner or merge-check. Plain spec-check does not print the
      owner: read it with --json (the step gate shows it too).
    migration:
      action: none

  - type: change_config
    description: >
      specdev upstream-backlog lists every open item of the spec grouped by the
      step of the nodes the item is about, not by the text of impact[]: a seed
      item under seed, a silent-spec item under the step of its missing kind, an
      item about nodes of several steps in each group (counted once), and an
      item that no group can hold under unplaced with W613. The JSON has
      schema_version "2"; each record has group, also_in, artifact, step,
      item_id, about, about_steps, decision, shape, description and impact, and
      a record of the 1.1.1 shape also has severity, status, bucket and
      matched_rule. ambiguity_id is now item_id; milestone_id, origin and
      matched_impact_entry are removed. In summary, items, with_answer,
      needing_answer and unplaced_count replace total_records, open_count,
      resolved_count, milestones_scanned and unclassified_count
      (hidden_by_status_count stays). The group unclassified is now unplaced;
      the bucket of such a record and the name of W613
      (UPSTREAM_BACKLOG_UNCLASSIFIED) keep unclassified, and the target of a
      W613 warning is now the artifact and item
      (impl_context/ms_x_plan.json:amb-old-2) where it was the milestone id and
      item (plan-ms-x:amb-old-2). --severity and --status filter items of the
      1.1.1 shape only. An artifact that cannot be read (bad JSON, no
      permission, a folder named like a step file), or a spec folder that does
      not exist, stops the run with E520 and exit 2. An item that cannot be
      reported (no id, neither about nor a valid severity, a severity outside
      its scale) prints one E520 line on stderr (item=(no id) for an item with
      no id); the run goes on and the exit code is 2. A decision of spaces only
      counts as no answer. --spec-root is still accepted and ignored.
    migration:
      action: none

  - type: change_config
    description: >
      The host pre-commit template templates/pre-commit-config.host.yaml runs
      spec-check ... --paths as its spec-check hook, with pass_filenames: true and
      require_serial: true, so a commit gates only the steps of the files it touches.
      scripts/init_project.py writes the template into a new host. A host that already
      has a .pre-commit-config.yaml keeps it, with its old hook that checks the whole
      spec on every commit, until its owner copies the new hook by hand.
    migration:
      action: none

  - type: change_config
    description: >
      A spec that has only some of its steps written fails spec-check on the
      role checks until its nodes are linked, or marked scope: later or out
      with a scope_reason where the kind has that field: the worked example, which is a partial
      spec, reports 17 E740, 5 E743 and 1 E744 and exits 1. The step gate
      lists a finding as pending (PENDING) until the step that owns it is
      gated, so spec-check --step 05 on the worked example now prints a
      PENDING line, and step ready 14 on it reports E773 with the five E743
      gaps of step 08 and step 13a as blockers.
    migration:
      action: none
