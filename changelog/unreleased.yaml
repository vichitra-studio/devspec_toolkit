version: "unreleased"
breaking: true

description: |
  DEVSPEC-37 — Schema-aware json writes, _effective_schema fix, and merge
  consolidation. Removes the broken --against-schema-field opt-in guardrail
  and replaces it with implicit differential whole-document schema validation
  built into json patch and json insert. Fixes _effective_schema's property
  overwrite bug so specdev json schema can navigate step-specific and
  conditional-gated fields. Consolidates schema-property-merge logic into a
  canonical core/schema_nav.py helper (DRY/SoC). Adds a registered schema
  for command_prefixes.json and a --create-schema bootstrap flag on json insert
  so the E530 remediation flow is not broken by the new validation invariant.

  DEVSPEC-38 — Remove status_ref from the spec data model; retire the status
  canon kind; add deterministic milestone-state engine. Breaking: removes the
  optional status_ref field from 21 schema properties across 6 files; under
  additionalProperties:false, host specs carrying status_ref will fail
  validation. The canon status kind (7 entries, 7 aliases) is retired — the
  schema string enums are now the sole status vocabulary. Adds specdev
  milestone-state CLI command for deterministic Trinity phase-position
  computation (replaces LLM-evaluated specdev-scope milestone_state mode).
  Versioning note (D4): this breaking change lands in 1.0.1 without a 2.0.0
  major bump — single private host, no external consumers; the cost is near
  zero. This is a consciously-recorded auditable decision, not CI-enforced.
  Separately, the governance-check step in ci.yml (specdev governance-check)
  validates PR-title commit conventions against the Step 10 governance rules,
  but does not gate semver policy.

  DEVSPEC-89 — E590 cross-reference enforcement for step-11 mitigation IDs;
  new W615/E615 INVARIANT_UNEXERCISED_BY_THREAT coverage check. Breaking:
  host specs with stale or invented mitigation IDs (any type except doc) will
  fail spec-check with E590 CROSS_STEP_ID_NOT_FOUND.

  DEVSPEC-87 — Adds specdev update as the primary post-submodule-bump entry
  point: re-stamps spec/specdev_version on no structural changes, or routes
  through specdev align when schema migration is required. Non-breaking
  (CLI addition + internal refactor; action: none).

changes:
  - type: remove_validator
    description: >
      Removed the --against-schema-field <step>.<field> flag from
      specdev json patch and specdev json insert. The flag was broken (wrong
      schema selected for multi-schema steps such as step 16; top-level-only
      resolution could not validate any nested or leaf write), structurally
      inadequate, and universally unused. Deleted: validate_against_schema_field,
      _find_schema_file, the argparse args, and the main() dispatch blocks that
      invoked them. The SKILL.md mandate for the flag is replaced with a note
      that validation is now automatic.
    migration:
      action: none

  - type: add_constraint
    description: >
      specdev json patch and specdev json insert now perform implicit
      always-on differential whole-document schema validation before every
      write. The file's own $schema URI is used for schema resolution (so
      multi-schema steps resolve correctly — the step 16 disambiguation that
      broke the old flag is a non-issue here). A write is refused only when
      it *introduces* a schema violation that was not already present in the
      document (differential / before-after diff), preserving incremental
      one-patch-at-a-time repair without deadlock. Additional refuse cases:
      the file has no $schema (didactic error), or the patch targets the
      $schema key itself (content-based detection, robust to any jq form).
      No --no-validate CLI bypass is exposed; the internal validate=True
      parameter is the only control, available to test code only. json delete
      is unchanged (no value written; spec-check covers required-field
      removal). Bare agent invocations (no --repo-root) resolve the toolkit
      root via a package-relative fallback so the constraint holds in
      submodule/host deployments without requiring agents to pass --repo-root.
    migration:
      action: none

  - type: fix
    description: >
      _effective_schema (used by specdev json schema) now resolves a node's
      effective properties own-first before merging allOf branches, and also
      unions properties from oneOf/anyOf/if-then-else conditional branches for
      discovery purposes. Previously, the allOf merge overwrote the node's own
      properties (the merged_props overwrite bug), causing specdev json schema
      to drop all step-specific fields on any schema node that combined own
      properties with an allOf. For example, specdev json schema on a step-16
      impl-context plan file could not navigate to .plan, .execution, or
      .review. The fix makes all step-specific fields and conditional-gated
      fields (e.g. plan.docs.required_updates) navigable by discovery. The
      corrected docstring at json_utils.py removes the false claim that
      conditional branches never add navigable properties.
    migration:
      action: none

  - type: internal_restructure
    description: >
      Schema-property-merge logic unified into a new canonical helper
      tools/specdev_tools/core/schema_nav.py (effective_schema). Previously
      three independent implementations existed: _effective_schema (with the
      overwrite bug), merge_allof (context/_utils.py, correct), and
      _get_all_properties (registry/generate.py, correct). All three now
      route through the shared helper. merge_allof and _get_all_properties
      use include_conditionals=False (behavior byte-preserved; conditionals
      are a discovery-only concern). _effective_schema uses
      include_conditionals=True to close the oneOf/if-then-else gap for
      specdev json schema. A new companion module
      tools/specdev_tools/core/schema_validate.py factors the schema-layer
      validation logic shared by validate_file and the new WS1 constraint.
    migration:
      action: none

  - type: fix
    description: >
      specdev validate / spec-check (and the new json write guard) now fail
      closed on all registry.load I/O errors, not just FileNotFoundError.
      Previously, validate.py only caught FileNotFoundError from registry.load;
      PermissionError and other OSErrors escaped uncaught. The new
      core/schema_validate.py helper catches the full OSError family and routes
      every case to SchemaNotFoundError → E520 schema_not_found. The E520
      message format is unchanged; only the set of caught exception types is
      wider. This was an intentional improvement in the DEVSPEC-37 refactor and
      is documented in the SchemaNotFoundError class docstring.
    migration:
      action: none

  - type: add_definition
    description: >
      New schema canon/command_prefixes.schema.json ($id vc:canon:command-prefixes)
      for the command_prefixes.json allowlist file (type object,
      additionalProperties false; required: allowed_prefixes array of string;
      optional: $schema uri, _description string). Registered in
      tools/schema_registry.json. The toolkit's own tools/command_prefixes.json
      gains a $schema key. This prevents the new WS1 no-$schema refuse rule
      from blocking the E530 remediation flow, which emits specdev json insert
      commands targeting command_prefixes.json. Alongside: new --create-schema
      <uri> flag on specdev json insert only. When the target file does not
      exist and --create-schema is given, the command seeds the file with
      {"$schema": "<uri>"} and bootstraps the array-valued field (null-coalescing
      create-variant jq filter), then runs the standard WS1 differential
      validation against the seed. Enables first-use bootstrap of
      spec/canon/command_prefixes.json by E530 remediation candidates without
      a separate file-creation step. Note: add is not a valid change_type in
      this toolkit's format.yaml; add_definition is the closest permitted
      kind for a new schema definition + its associated CLI flag.
    migration:
      action: none

  # DEVSPEC-38 changes below

  - type: remove_field
    description: >
      DEVSPEC-38: Removed the optional status_ref canonical-reference field from
      21 schema properties across 6 files: schema/04_fr_list.schema.json (1
      property), schema/06_invariants.schema.json (1), schema/09_impl_plan.schema.json
      (1), schema/14_roadmap.schema.json (2), schema/16_impl_context.schema.json (15),
      and schema/core/collections.schema.json (1). All affected schemas use
      additionalProperties:false, so host spec files carrying status_ref will fail
      validation after this change. At the 04 and 06 sites there was no sibling
      status string; status_ref was the sole status field there (host never populated
      these — 0 data loss, but FR- and invariant-level canonical status tracking is
      dropped by design). At all other sites the status string is the retained source
      of truth; 100% of host status_ref objects had a sibling status string (REF-ONLY
      = 0 / 736 verified), so deletion is lossless.
    migration:
      action: auto
      note: >
        Delete every status_ref object from all spec artifacts. Remove now-orphaned
        cn:*:status:* IDs from each file's canonical_refs_used[]. Run
        specdev canonical-autofix <spec-dir> --write to reconcile canonical_refs_used
        automatically (the sync prunes stale cn:* IDs). See the Migration section
        of changelog/unreleased.md for the full inline migration steps.

  - type: change_schema
    description: >
      DEVSPEC-38: Retired the canon status kind. Deleted canon/kinds/status.json
      (7 entries: active, blocked, deferred, green, pending, red, verified). Removed
      7 status aliases from canon/aliases.json (approved→verified, fail→red,
      failed→red, not started→pending, pass→green, passed→green, postponed→deferred).
      Removed 14 kind:status entries from canon/manifest.json (7 canonical entries +
      7 mirrored alias entries). The schema status string enums are now the single
      source of truth for status vocabulary. This resolves the enum↔label divergence
      described in DEVSPEC-38: the milestone-lifecycle enums (in_progress, done,
      needs_work) and the health/CI canon labels (active, green, red) were never the
      same vocabulary. Retiring the canon kind removes the second vocabulary entirely.
      Also removed dead Python status machinery: INFERENCE_RULES status rule
      (core/constants.py), alias_value_fields["status_ref"] (canonical/integrity.py),
      and "status" from _FALLBACK_DIRECT_FIELDS (canonical/integrity.py).
    migration:
      action: none

  - type: add_module
    description: >
      DEVSPEC-38: New tools/specdev_tools/context/milestone_state.py — pure,
      unit-tested deterministic milestone-state engine. Provides
      derive_group_state() and derive_phase_position() functions. Inputs:
      implementation.status string + .specdev/findings/ filesystem probes +
      deterministic blocking-ambiguity string-match. No status_ref. New CLI
      subcommand specdev milestone-state (--batch-id required; --repo-root,
      --spec-root, --git-root optional). Output: {milestone_id, groups[],
      derived_phase_position, blockers[]} with per-group blocking_amb_health.
      Replaces the LLM-evaluated milestone_state mode of the specdev-scope agent
      (D7/D7a). The specdev-scope agent now delegates to this CLI and passes the
      JSON through unchanged — the orchestration contract is identical, specdev-trinity
      skill parsing is unaffected. Removes macOS/Linux stat/date shell branches;
      uses os.stat().st_mtime + datetime.fromtimestamp with timezone.utc cross-platform.
    migration:
      action: none

  # DEVSPEC-89 changes below

  - type: add_constraint
    description: >
      DEVSPEC-89: validate_step_11 now cross-references mitigation IDs against
      upstream spec steps for all mitigation types except doc: capability →
      step 01 (capabilities[].capability_id), fr → step 04
      (functional_requirements[].fr_id), api → step 05 (apis[].api_id), inv →
      step 06 (rules[].inv_id), nfr → step 07 (nfrs[].nfr_id), fixture → step
      08 (fixtures[].fixture_id). When the upstream file is absent the check is
      skipped (None sentinel). doc mitigations remain exempt from all
      cross-reference validation. Fires E590 CROSS_STEP_ID_NOT_FOUND for
      unresolvable IDs. Also adds W615/E615 INVARIANT_UNEXERCISED_BY_THREAT:
      fires W615 when a step-06 invariant carries a risk_category_ref but no
      step-11 threat mitigation of type inv references it; promotable to E615
      via SPECDEV_WARNINGS_AS_ERRORS=1 or SPECDEV_PROMOTE_CODES=W615.
      Additionally adds invariant_threat_coverage map (inv_id → [threat_ids])
      to specdev matrix output. step_order.json required_spec_inputs for step
      11 updated to include 01 and 08 (was 02,04,05,06,07; now
      01,02,04,05,06,07,08); downstream_consumers for steps 01 and 08 updated
      to include 11. target_ids description-only change: valid threat-target
      types are api and component only (fr and inv removed from description).
      prompt_11_redteam.md updated: net-new controls with no existing upstream
      artifact must use type doc (exempt); type capability is reserved for
      referencing an EXISTING cap-* ID from Step 01. Constraint line, Mitigate
      step, capability example, Coverage Closure, and target_ids description in
      Cross-Step Synthesis Notes all updated accordingly.
    migration:
      action: ai_assisted
      note: >
        Host specs with stale or invented mitigation IDs (any type except doc)
        will newly fail spec-check with E590. Net-new type:capability controls
        that do not reference an existing cap-* ID from step 01 must be changed
        to type:doc with a concrete action in note. For each step-06 invariant
        with risk_category_ref, add a threat mitigation of type:inv referencing
        it (or suppress W615 via SPECDEV_PROMOTE_CODES if intentionally
        deferred). Run specdev spec-check to confirm clean after remediation.

  # DEVSPEC-87 changes below

  - type: add_module
    description: >
      DEVSPEC-87: New `specdev update` command — syncs a project to the current
      toolkit version. Re-stamps specdev_version on no structural changes
      (exit 0); directs through specdev align (apply --auto → prompts →
      validate) when schema migration is required (exit 1). Supports --dry-run
      and --json.
    migration:
      action: none
      note: "CLI addition only — no spec artifact changes."

  - type: internal_restructure
    description: >
      DEVSPEC-87: stamp_specdev_version extracted from validate_post_migration
      into a shared helper in schema_differ.py. is_migration=False preserves
      last_migration and omits migration_history entries; is_migration=True
      (align validate only) appends a history entry and updates last_migration.
      E608 messages in spec_check updated to direct users to specdev update.
    migration:
      action: none
      note: "Internal refactor and message update — no spec schema changes."
