      title still mentions the trace matrix; tests/fixtures/spec_corpus stays
      1.1.1-shaped. Some procedures in those prompts, skills and agents do not
      work on a 1.2.0-shaped spec until then: the milestone-close steps of
      prompt_16c_impl_reviewer.md and of the specdev-trinity skill (the anchor
