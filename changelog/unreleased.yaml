  - type: add_module
    description: >
      specdev spec-check runs eight new checks over the whole spec, each
      before open-items: no-dangling (E740: a node of a requirement, delivery
      or context kind that no node uses), term-use (E741: a glossary term
      whose label no node of steps 04 to 15 mentions), verifier-rules (E742: a
      fixture that no task criterion lists in verified_by, or a job that none
      lists and that realises and verifies nothing; E743: a
      criterion, API, invariant or NFR that no fixture verifies, where a job
      also counts for an NFR), cross-cutting (E744: a task that an invariant
      or NFR applies to, when no criterion of the task refines it), refinement
      (E745: a task criterion whose verifiers do not verify what it refines),
      scaffold-paths (E746: the file of a scaffold row of a built API is not
      tracked by git; the check is skipped outside a git repository),
      seed-routes (E747: a seed no route names; E748: a route no node of its
      step uses; E749: a node links a seed that the manifest does not route to
      its step) and prose-ids (E752: a node id written in the text of a node).
      The new codes are E740 to E749 and E752 (E750 and E751 do not exist); each has an entry in docs/developers/error-codes.md
      and an owner in tools/error_ownership.json: step 14 for E741, E742, E744
      and E745, step 08 for E743, step 15 for E746, step 00 for E747, the step
      of the route for E748, the step of the node for E749 and E752, and for
      E740 the latest step whose nodes can use the kind. None is promotable.
      The checks run on every spec: none is skipped because the files look
      like 1.1.1, so a spec that has not been migrated gets them too (E752
      reports its old link fields trace and targets). A child keeps its own
      scope: an FR set to scope: later does not park its criteria. E740 ends
      with the ways out that exist for the kind: link it always, schedule it
      only for a kind that a step 09 milestone's schedules is one of the ways to
      use (a criterion, an FR, an NFR, an API, an invariant, a risk), and set
      scope later or out with a scope_reason only for a kind whose schema has a
      scope field. E742 ends list it in a criterion's verified_by, or remove it
      and run specdev attest --prune (or remove it and the links to it (N nodes:
      specdev trace <id> --down --depth 1 lists them) and run specdev attest
      --prune when a node still links it);
      E743 asks for a fixture at step 08 that
      verifies the node and that a task criterion lists in verified_by (for an
      NFR, or a job at step 12 that verifies it); E744 asks for a task
      criterion that refines the node and lists in verified_by a verifier that
      verifies it; E747 says to route the seed and list it in derives_from of a
      node of that step, or to remove the seed (its seeds[] entry, its
      global_seed_order entry when it has one, and its document, and the
      links to it with their count and the command that lists them, then
      specdev attest --prune);
      E748 says to distil the seed in that step, to move the route to step 00,
      02 or 02a when no node of the step can link a seed, to remove the route,
      or, when it is the seed's only route, to remove the seed with it and the
      links to it that nodes still hold; E749
      ends or remove the link and run specdev attest --prune (a derives_from
      that would be left empty needs another entry). A message that says to
      remove a node says how many nodes still link it and the command that
      lists them (specdev trace <id> --down --depth 1); the catalogue says
      once, as a loop, what removing a node takes. A fix
      that adds, changes or removes a link ends with specdev attest <node> --yes for each node an
