      prompt_13a_completeness_assessment.md, which copies the four coverage
      numbers that completeness-check does not compute on that shape.
    migration:
      action: none

  - type: add_module
    description: >
      New commands for reading the spec as a graph (graph/commands.py); each takes
      --repo-root, --spec-root (default ./spec), --git-root (default: the folder that holds --spec-root) and --json. specdev node
      <id> [<id> ...] [--full] (also specdev node show <id>, which
      reads an id that is itself a subcommand name) shows a node: file and jq
      path, content, links out and the number of links in. specdev node candidates
      (--kind KIND | --for ID) --field FIELD [--query TEXT] [--limit N] lists the
      nodes a link field may point at. specdev node status <id>
      active|deprecated|not_applicable writes the node's lifecycle into its spec
      file (active removes the key from a node that has another value) and prints
      <id>: <old> -> <new> (<file>); a node that already has the value is not
      written, an explicit "lifecycle": "active" in its file included, and the line
      reads <id>: already <value>, nothing written (<file>).
      specdev trace <id> [--up] [--down] [--depth N] [--kinds K,K] [--verbs V,V]
      [--no-containment] lists what the node rests on and what rests on it.
      specdev trace <id> --recipe 16a|16b|16c [--expand] [--since REF] prints the
      context pack of a role. specdev diff <refA> <refB> compares the graph at two
      git refs (the working tree is not read) and prints a suggested version bump.
      A command that cannot answer prints one finding on stderr (with --json, the
      status / errors envelope on stdout) and exits 1, for example:
      E705 for a lifecycle change that is refused (a seed node, an unknown id, a
      lifecycle value that is not one of the three, a write the JSON tools refuse),
      E706 for an unknown id, kind,
      link field or recipe role, E707 for a recipe start node of the wrong kind,
      E708 for a ref that does not resolve or a spec folder that cannot be read at
      it, E709 for a ref whose tree has no graph node (a tree from before 1.2.0 that
      has ids the registry reads is compared as it is, and the result is not
      meaningful), E520 for a spec folder that is missing. When a spec file cannot be read, node, node candidates, node status
      and trace print one more line on stderr that names the file and says the
      answer may be incomplete, and an unknown id then says the node may be in one
      of those files. The commands are listed in tools/cli_commands.json.
    migration:
      action: none

  - type: add_module
    description: >
      specdev spec-check runs a new check, graph (before registry-check), over the
      whole spec: E700 (a link names an id no node has; when a spec file that could hold the target could not be read, the message says so), E701 (a node of a kind the
      field does not accept), E702 (a node of a later step), E703 (a cycle within
      one step, one finding per cycle) and E704 (an id defined more than once). In
      spec-check --json these findings carry owner (for example step:12) and
      node_id. The graph check reports W720 (a link to a deprecated node) and E761
      as well (see the trace lock below). validate-all does not run the check; it
      reports the trace-lock findings listed below.
    migration:
      action: none

  - type: remove_validator
    description: >
      Removed from the step validators, and reported by the graph check of
