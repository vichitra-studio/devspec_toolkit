  - type: add_module
    description: >
      specdev update SPEC_DIR installs the toolkit's files into the host before
      it re-stamps spec/specdev_version: seven pieces, each reported as created,
      refreshed, current, drift, refused or would_install. They are the
      toolkit's pre-commit hooks between # >>> specdev-managed and # <<<
      specdev-managed in .pre-commit-config.yaml (and pre-commit install in the
      clone), the lock merge driver (the clone's git config and
      .git/info/attributes), .github/workflows/specdev-merge-check.yml (the
      merge gate, and release prep on release-prep/ branches; its "Host setup"
      step is the declared setup_command), tools/run_specdev.sh and
      tools/ensure_venv.py rendered with the host's venv name, links of the
      toolkit's skills and agents into .claude/, ten ask rules (milestone
      sign-off, milestone defer, release and verify attest, in the specdev and
      ./tools/run_specdev.sh forms) in the clone's .claude/settings.local.json,
      and the line .specdev/ in .gitignore. New flags: --git-root (the host
      root), --install-only (no version check, no stamp), --no-install, --adopt
      (replace hand-written toolkit hooks by the marked block and rewrite an
      edited wrapper; never a workflow), --force-claude (replace stale links,
      never a real file) and the --json key host_install; a second run changes
      nothing. What a host already has is left as it is and reported: W930 for
      drift, W931 for a piece that could not run, W932 for a retired command
      (validate-all, matrix, forward-replay-check, completeness-check,
      traceability-check, trace_matrix.json) in the host's own workflows and
      hook file, W935 for no declared setup_command; the warnings never change
      the exit code. init writes no CI workflow, no pre-commit file and no skill
      links itself any more: after it creates the venv it runs specdev update
      spec --repo-root <toolkit> --install-only (init --force-claude forwards
      the flag). Run update once in every clone, and commit what it wrote before
      specdev verify run: the installed files belong to the code tree. Shown by
      specdev update spec --repo-root ./devspec_toolkit --git-root .
      --install-only --dry-run.
