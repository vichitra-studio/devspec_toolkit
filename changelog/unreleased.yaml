      check also reports E761, W720 (a new link to a deprecated node), E771 (an
      alias that collides), E772 (a replaces link to a node still in the spec)
      and E778 (a live node that links by an old id). validate-all reports E760
      to E763, E778, E882 and W720 too. The error-code catalogue has an entry
      for each, with a message copied from a run. The skills /specdev-step and
      /specdev-context write links by node id (json patch|insert|delete --id,
      json insert --step, step create --from), which write the lock entries; a
      write with the path form of specdev json (json patch <file> <path>
      <value>) writes no lock entry, so a spec with links reports E761 after
      such a write.
