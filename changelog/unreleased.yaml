      an annotated tag on HEAD and writes nothing else: no commit, no push, no
      version number. The release gate runs the checks of spec-check, the
      open-item and pin checks of the merge gate, the scaffold check in release
      mode (E746), E913 for a milestone closed with no close record, E914 for an
      obligation in scope that is not built at ci, E343 and E344 for a
      realisation that nothing answers, E347 and E348 for the proof of each
      obligation, E830 for a rule enforced by review that has no attestation,
      E928 for a design milestone that no roadmap milestone realises and, for
      the previous release, E920 when it was neither verified in production nor
      waived; what is scope later or out is listed and blocks nothing (W933),
