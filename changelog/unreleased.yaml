  - type: add_module
    description: >
      specdev verify bind <verifier-id> --command CMD [--command CMD ...]
      --guard REGEX [--proves ID ...] [--stage dev|ci|staging|prod] [--id
      ver-ID] writes the verification record spec/extras/verification/<id>.json
      of a fixture, a job or a rule (never a spec file), and specdev verify run
      [ver-ID ...] [--all | --milestone ms-ID] [--stage S] [--only-stage]
      [--no-record] [--installed TP=VERSION ...] [--timeout SEC] runs the
      commands of bindings and writes one evidence record
      evd-<name>-<stage>.json (<name> being the binding id without its ver-
      prefix) for each, with the code-tree id of the run and the version that
      each declared source reads for the third parties the proved nodes rely on
      (those reached through the providing component's connections included).
      verify run exits 1 when a binding fails and warns W350 (a registered
      submodule with uncommitted content; an embedded repository that is not a
      registered submodule is not seen) and W351 (the run changed the code
      tree). Evidence rests on the binding too: the run records the hash of the
      binding itself beside the hashes of its verifier and of the nodes it
      proves, so after a change of a binding (its commands, guard, stage or
      proves) its evidence is stale (E347 STALE_HASH) until verify run is
      repeated, while a verify bind that changes nothing leaves it valid;
      evidence written without the hash of the binding is stale once. verify
      bind of the same verifier and nodes replaces the record, whatever its id,
      also when the stage differs, so the plain command is the way out of E330
      for every stored binding. A third party that the proved nodes rely on and
      that has a declared version source but no version recorded by the run (a
      source declared after the run, or a reliance that appeared after it) makes
      the evidence stale (E347 STALE_TP_VERSION) until verify run is repeated.
      The guard of a binding is compiled before its commands run, so a guard
      that is no regular expression is E332 and nothing ran. An id of
      --installed that is no third-party node is E706 and a third party named
      twice is a usage error (exit 2). Shown by
      specdev verify bind --help, specdev verify run --help and specdev verify
      run --all, which prints one PASS or FAIL line for each binding and then N
      run, N passed, N failed.
    migration:
      action: none

  - type: add_module
    description: >
      specdev third-party pin <tp-id> <version> writes the pin of a third-party
      node through the id-keyed write path (the links into the node become
      suspect; E336 for a pin that is not exact: empty, latest, *, an x-wildcard
      or a range). specdev third-party check compares the pin of each third
      party that declares pin_sources with the version its sources read (E336,
      E337, E338; every pin matches its declared sources and exit 0, or exit 1);
      with --installed TP=VERSION [TP=VERSION ...] --env ENV [--tag TAG] it
      compares what a deploy installed with the pins (E339 and exit 1, which
      stops the deploy; E706 for an id that is no third-party node; a third
      party named twice is a usage error) and, when all match, writes one
      install-check evidence record for each third party
      (evd-<name>-<env>-install.json). third-party pin of the pin a
      node already has writes nothing and prints <id> already has the pin
      <version>; nothing written (exit 0, no reminder), and writes the value
      without surrounding spaces. Shown by specdev third-party check and specdev
      third-party pin.
