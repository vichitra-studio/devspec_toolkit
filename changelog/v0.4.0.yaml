version: "0.4.0"
release_date: "2026-02-27"
breaking: true
description: |
  Simplifies generation_quality to assumptions-only, removes redundant E511
  PLACEHOLDER_SCAN_MISMATCH validator, and provides a migration script to
  convert existing artifacts automatically.

steps: []

changes:
  - type: remove_field
    path: "generation_quality.preflight_passed"
    description: "generation_quality reduced to assumptions-only — removed preflight_passed, evidence_records, unresolved_inputs, placeholder_scan, self_check_results sub-fields and the required array"
    migration:
      action: auto
      note: "Run python -m specdev_tools.migration.scripts.strip_generation_quality on all spec and fixture directories"

  - type: remove_validator
    description: "Removed E511 PLACEHOLDER_SCAN_MISMATCH error code and _check_placeholder_scan_agreement() validator — E510 independently catches all placeholder issues"
    migration:
      action: none

  - type: add_script
    path: "tools/specdev_tools/migration/scripts/strip_generation_quality.py"
    description: "Migration script to convert old-format generation_quality blocks to assumptions-only"
    migration:
      action: none
