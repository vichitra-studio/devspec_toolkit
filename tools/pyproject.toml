[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specdev_tools"
version = "0.5.0"
description = "Internal tooling for DevSpec Toolkit"
authors = [{name = "Vichitra Collective"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.21.1",
    "pyyaml>=6.0.1",
    "jsonschema-specifications>=2023.12.1",
    "pyjwt>=2.8.0",
]

[project.scripts]
specdev = "specdev_tools.cli:main"

[tool.setuptools.packages.find]
include = ["specdev_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
