# The 1.1.1 -> 1.2.0 shape migration map: ONE row per row of tools/schema_changes.json (the generated schema-change
# checklist: the authority for which field 1.2.0 removed, changed or added), and what the migration does with it.
# tests/unit/migration/test_migration_dispositions.py fails when a checklist row has no row here, when a row here names
# a checklist row that does not exist or whose path or change differs, and when a row has more or less than one
# disposition.  Rows are written against the checklist; the 1.1.1 shapes are those of the released toolkit
# (tests/fixtures/schema_baseline/paths_1.1.1.json lists their paths).
#
# disposition (exactly one per row):
#   convert              the field's value becomes a declared 1.2.0 field or shape (the source field goes with it)
#   remove               the field is removed; nothing replaces it and no later phase reads its value
#   copy-dropped         the field held copies of text kept elsewhere (artifact-level trace: FR statements in its notes)
#   capture-then-remove  the value is in capture.json (captured_in names the section) before it is removed
#   worklist             judgement: the script writes one worklist item per case and changes the data only as stated
#   none                 nothing to migrate (an addition, or a schema definition with no data of its own)
# script: the migration script that applies the row (a p3_* script of this file's bundle, or the p2/p4/p5 script that owns it).
# captured_in: the section of spec/extras/migration/capture.json that holds the value first.
# closed_plans (rows about a plan file only): keep (default) or strip.  A legacy-closed plan loses the stored computed
#   names (strip) and nothing else; it keeps the rest as history (ruling P13).  Open plans get the whole map.
# convert: how p3_convert applies the row (type refs | typed | rename | value | out-of-scope | rule-scope |
#   environment-config | schedules | spec-ref | defaults); the field-to-kind rules it uses are those of legacy_ref_fields.yaml.

# Files the migration deletes whole (not rows of the checklist: step 13a is row SC-13a-01).  `step` files are found by
# the step id of their name, `path` files by their path in the spec folder.
retired_files:
  - {step: "13a", why: "step 13a is retired as a step and as a file (DS L226)"}
  - {path: extras/trace_matrix.json, why: "the stored trace matrix is retired (DOC L1193); a leftover file is read by nothing"}

# Host canon (spec/canon): kinds the toolkit's canon no longer has are reported and removed with their manifest entries;
# a renamed kind is rewritten in the host's kind file, manifest entries and aliases.
host_canon:
  retired_kinds: [completeness_dimension, trace_type]
  renamed_kinds: {inv: invariant}

