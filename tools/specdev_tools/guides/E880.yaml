code: E880
subcode: MIGRATION_PREFLIGHT
title: "The migration refuses to start"
trigger: |
  `specdev align apply --auto` stopped before it wrote anything. The message
  names the reason:
    - "is not a git work tree": the host is not a git repository, or --git-root
      names a folder that is not one.
    - "records no toolkit_version": spec/specdev_version has no
      toolkit_version, or the file does not exist.
    - "is not a version number", "older than 1.0.0", "newer than this
      toolkit", or "is not a version listed in <toolkit>/changelog": the stamp
      names a version the migration cannot start from.
    - "has uncommitted changes": spec/ is not committed.
  A dry run (--dry-run) is allowed on a dirty spec/, and a run that resumes (the
  stamp says migration_status: in_progress) is allowed too.
resolution: |
  1. Not a git work tree: run `git init` in the host, commit the spec, run again.
     Pass --git-root <host root> when the spec folder is not at the top.
  2. No toolkit_version (or no spec/specdev_version at all): write the version
     the spec was built with into spec/specdev_version, for a 1.1.1 spec
         toolkit_version: "1.1.1"
     commit it, and run again. Do not run `specdev update` first: on a spec
     with no stamp it stamps the new version, and the migration then reads the
     spec as already migrated and never runs.
  3. A version the migration cannot start from: update the toolkit submodule to
     the release you migrate to ("newer than this toolkit"); for a version the
     changelog does not list, or a stamp that is not a version number (for
     example `toolkit_version: "abc"`), put the version the spec was really
     built with into the stamp.
  4. Uncommitted changes: commit them (the migration is reviewed with
     `git diff spec` and undone with `git checkout -- spec && git clean -fd
     spec`), or pass --allow-dirty when the changes are the ones you want migrated.
  Then run again:
       specdev align apply spec --auto --dry-run \
         --repo-root ./devspec_toolkit --git-root .
