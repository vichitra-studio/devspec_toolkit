# Pre-commit hooks for the DevSpec Toolkit (toolkit-internal).
# Install: bash scripts/init_toolkit_dev.sh  (or: uv pip install pre-commit && pre-commit install)
# Run manually: pre-commit run --all-files
#
# Host repos that vendor the toolkit as a submodule should copy the
# template at templates/pre-commit-config.host.yaml and adjust
# --repo-root to ./devspec_toolkit (or wherever the submodule lives).
repos:
  - repo: local
    hooks:
      - id: dag-lint
        name: DAG completeness lint
        entry: python -m specdev_tools.cli dag-lint --repo-root .
        language: system
        pass_filenames: false
        files: (tools/step_order\.json|prompts/prompt_.*\.md)$
        types: [file]
      - id: extraction-intent-check
        name: Extraction intent validation
        entry: python -m specdev_tools.cli extraction-intent-check --repo-root .
        language: system
        pass_filenames: false
        files: (tools/step_order\.json|prompts/prompt_.*\.md)$
        types: [file]
